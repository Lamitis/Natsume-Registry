name: build-registry

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
  # 手动补跑：verify-plugin 的自动合并是用 GITHUB_TOKEN 推的，按 GitHub 规则这类推送
  # 不会再触发本工作流；有这一条就能在 Actions 页面点一下重建（或 `gh workflow run build-registry`）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rebuild
        run: python scripts/build_registry.py
      - name: commit
        run: |
          git config user.name "natsume-registry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "chore: rebuild registry.json"
          git push