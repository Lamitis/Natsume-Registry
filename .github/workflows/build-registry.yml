name: build-registry

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rebuild
        run: python scripts/build_registry.py
      - name: commit
        run: |
          git config user.name "natsume-registry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "chore: rebuild registry.json"
          git push